[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent"
version = "0.1.0"
description = "Portable workflow kernel for tailored two-page resumes"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pypdf>=5.0",
    "Pillow>=10.0",
]

[project.scripts]
resume-agent = "resume_agent.cli:main"

[tool.setuptools.packages.find]
include = ["resume_agent*"]
